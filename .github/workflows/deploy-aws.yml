name: Deploy Gyan AI to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1                   # Change to your preferred region (e.g. us-east-1)
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'ap-south-1' }}.amazonaws.com
  BACKEND_ECR_REPO: gyan-ai-backend
  FRONTEND_ECR_REPO: gyan-ai-frontend
  BACKEND_ECS_SERVICE: gyan-backend-service
  FRONTEND_ECS_SERVICE: gyan-frontend-service
  ECS_CLUSTER: gyan-ai-cluster
  BACKEND_TASK_DEF: gyan-backend-task
  FRONTEND_TASK_DEF: gyan-frontend-task

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build & Push Docker Images to ECR
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.backend-build.outputs.image }}
      frontend-image: ${{ steps.frontend-build.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Backend Image ──────────────────────────────────────
      - name: Build, tag, and push BACKEND image
        id: backend-build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$BACKEND_ECR_REPO:$IMAGE_TAG

          docker build -t $IMAGE ./backend
          docker tag  $IMAGE $ECR_REGISTRY/$BACKEND_ECR_REPO:latest
          docker push $IMAGE
          docker push $ECR_REGISTRY/$BACKEND_ECR_REPO:latest

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      # ── Frontend Image ─────────────────────────────────────
      - name: Build, tag, and push FRONTEND image
        id: frontend-build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$FRONTEND_ECR_REPO:$IMAGE_TAG

          docker build -t $IMAGE ./frontend
          docker tag  $IMAGE $ECR_REGISTRY/$FRONTEND_ECR_REPO:latest
          docker push $IMAGE
          docker push $ECR_REGISTRY/$FRONTEND_ECR_REPO:latest

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy Backend to ECS Fargate
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.BACKEND_TASK_DEF }} \
            --query taskDefinition \
            > backend-task-def.json

      - name: Fill in new backend image in task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: gyan-backend
          image: ${{ needs.build-and-push.outputs.backend-image }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.BACKEND_ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to ECS Fargate
  # ─────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to ECS
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-backend]   # Frontend deploys after backend is stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.FRONTEND_TASK_DEF }} \
            --query taskDefinition \
            > frontend-task-def.json

      - name: Fill in new frontend image in task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: gyan-frontend
          image: ${{ needs.build-and-push.outputs.frontend-image }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.FRONTEND_ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Print deployment success
        run: |
          echo "✅ Gyan AI deployed successfully to AWS ECS!"
          echo "📦 Backend Image: ${{ needs.build-and-push.outputs.backend-image }}"
          echo "📦 Frontend Image: ${{ needs.build-and-push.outputs.frontend-image }}"
