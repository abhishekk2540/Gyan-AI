version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gyan-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      # Persist the vector store JSON between container restarts
      - gyan-data:/app/data
    networks:
      - gyan-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gyan-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gyan-net

volumes:
  gyan-data:
    driver: local

networks:
  gyan-net:
    driver: bridge
